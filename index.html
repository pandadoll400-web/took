<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나무 흔들기 게임 - 특성 시스템 및 대규모 밸런스 패치</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #1e272e;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
            touch-action: none; font-family: 'Malgun Gothic', sans-serif;
            user-select: none; -webkit-user-select: none;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            background-color: #222;
        }
        #gameCanvas { display: block; }
        
        #money-display {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0, 0, 0, 0.7); color: #f1c40f;
            font-size: 20px; font-weight: bold;
            padding: 8px 15px; border-radius: 20px;
            border: 2px solid #f39c12; pointer-events: none; z-index: 10;
        }
        
        #level-container {
            position: absolute; top: 15px; left: 50%;
            transform: translateX(-50%); width: 250px;
            text-align: center; pointer-events: none; z-index: 10;
        }
        #level-text {
            color: white; font-size: 22px; font-weight: bold;
            text-shadow: 2px 2px 4px #000; margin-bottom: 5px;
        }
        #xp-bar-bg {
            background: rgba(0,0,0,0.6); border: 2px solid #fff;
            border-radius: 10px; height: 15px; width: 100%;
            overflow: hidden; position: relative;
        }
        #xp-bar-fill {
            background: linear-gradient(90deg, #3498db, #9b59b6);
            height: 100%; width: 0%; transition: width 0.3s;
        }

        #inventory-btn {
            position: absolute; bottom: 20px; left: 20px;
            background: #8e44ad; color: white; font-size: 18px; font-weight: bold;
            padding: 15px 20px; border-radius: 50%; border: 3px solid #9b59b6; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5); z-index: 10;
        }
        #inventory-btn:active { transform: translateY(2px); }

        #shop-btn {
            position: absolute; bottom: 20px; left: 100px;
            background: #f1c40f; color: black; font-size: 18px; font-weight: bold;
            padding: 15px 20px; border-radius: 50%; border: 3px solid #f39c12; cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5); z-index: 10;
        }
        #shop-btn:active { transform: translateY(2px); }
        
        #shop-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(30, 40, 50, 0.95); color: white; padding: 20px; border-radius: 15px;
            width: 85%; max-width: 350px; max-height: 80%; overflow-y: auto; display: none; border: 2px solid #fff; z-index: 30;
        }
        .shop-tabs { display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; }
        .shop-tab-btn { flex: 1; padding: 10px; border: none; background: #7f8c8d; color: white; font-weight: bold; border-radius: 5px; cursor: pointer; }
        .shop-tab-btn.active { background: #f1c40f; color: black; }
        .axe-item { background: #2c3e50; margin-bottom: 15px; padding: 15px; border-radius: 10px; border: 2px solid #7f8c8d; text-align: center; }
        .axe-item h3 { margin: 0 0 10px 0; color: #fff; }
        .axe-item p { margin: 5px 0; font-size: 14px; color: #ecf0f1;}
        .axe-item button { padding: 8px 15px; background: #2ecc71; color: white; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%;}
        .axe-item button:disabled { background: #95a5a6; cursor: not-allowed; }
        .limited-box { background: #2c3e50; border: 2px solid #f1c40f; padding: 20px; border-radius: 10px; text-align: center; box-shadow: 0 0 15px rgba(241, 196, 15, 0.2); }
        .limited-title { font-size: 20px; font-weight: bold; color: #f1c40f; text-shadow: 0 0 10px rgba(241, 196, 15, 0.8); margin-bottom: 15px; }
        .limited-desc { color: #bdc3c7; font-size: 13px; line-height: 1.5; margin-bottom: 15px; }
        .limited-soldout { color: #e74c3c; font-weight: bold; font-size: 15px; margin-bottom: 15px; }
        .limited-btn { width: 100%; padding: 12px; background: #8e7a3f; color: #333; font-weight: bold; border: none; border-radius: 5px; cursor: not-allowed; }

        #inventory-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95); color: white; padding: 20px; border-radius: 15px;
            width: 80%; max-height: 70%; overflow-y: auto; display: none; border: 2px solid #fff; z-index: 20;
        }
        #inventory-modal h2 { margin-top: 0; text-align: center; color: #f1c40f; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .grid-item { background: #2c3e50; padding: 10px; border-radius: 10px; text-align: center; font-size: 14px; }
        .close-btn {
            display: block; margin: 20px auto 0; padding: 10px 20px; background: #e74c3c;
            color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="money-display">💰 0</div>
        <div id="level-container">
            <div id="level-text">LV. 1</div>
            <div id="xp-bar-bg"><div id="xp-bar-fill"></div></div>
        </div>
        <button id="inventory-btn">가방</button>
        <button id="shop-btn">상점</button>
        
        <div id="shop-modal">
            <h2>상점</h2>
            <div class="shop-tabs">
                <button class="shop-tab-btn active" onclick="switchShopTab('axe')">도끼</button>
                <button class="shop-tab-btn" onclick="switchShopTab('limited')">한정조합</button>
                <button class="shop-tab-btn" onclick="switchShopTab('skin')">시즌 스킨!</button>
            </div>
            
            <div id="shop-axe" style="display: block;">
                <div class="axe-item">
                    <h3>🪓 나무 도끼</h3>
                    <p>나무 패는 시간: 5초 ➔ 4초</p>
                    <p>가격: 💰 100,000</p>
                    <button id="btn-axe-1" onclick="buyAxe(1, 100000)">구매하기</button>
                </div>
                <div class="axe-item">
                    <h3>⛏️ 은 도끼</h3>
                    <p>나무 패는 시간: 4초 ➔ 3.5초</p>
                    <p>가격: 💰 500,000</p>
                    <button id="btn-axe-2" onclick="buyAxe(2, 500000)">구매하기</button>
                </div>
                <div class="axe-item">
                    <h3>✨ 금 도끼</h3>
                    <p>나무 패는 시간: 3.5초 ➔ 3.2초</p>
                    <p>가격: 💰 10,000,000</p>
                    <button id="btn-axe-3" onclick="buyAxe(3, 10000000)">구매하기</button>
                </div>
            </div>
            
            <div id="shop-limited" style="display: none;">
                <div class="limited-box">
                    <div class="limited-title">✨ 고대 도끼 한정 조합 ✨</div>
                    <div class="limited-desc">금 도끼와 잊혀진 심해의 광석을 융합하여 강력한 고대 도끼를 만듭니다. (나무 패는 시간 대폭 감소)</div>
                    <div class="limited-soldout">매진되었습니다! (시간 초과)</div>
                    <button class="limited-btn" disabled>매진</button>
                </div>
            </div>

            <div id="shop-skin" style="display: none; padding-top: 10px;">
                <div id="skin-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
            </div>
            
            <button class="close-btn" onclick="document.getElementById('shop-modal').style.display='none'">닫기</button>
        </div>

        <div id="inventory-modal">
            <h2>인벤토리</h2>
            <div class="shop-tabs">
                <button class="shop-tab-btn active" onclick="switchInvTab('items')">과일</button>
                <button class="shop-tab-btn" onclick="switchInvTab('skins')">스킨</button>
            </div>
            
            <div id="inv-items" style="display: block;">
                <div class="grid" id="inventory-grid"></div>
            </div>

            <div id="inv-skins" style="display: none;">
                <div id="inv-skin-list" style="display: flex; flex-direction: column; gap: 10px;"></div>
            </div>

            <button class="close-btn" id="close-modal-btn">닫기</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('game-container');

        const GAME_WIDTH = 600;
        const GAME_HEIGHT = 1000;
        let cameraY = 0; 
        
        function resize() {
            const windowRatio = window.innerWidth / window.innerHeight;
            const gameRatio = GAME_WIDTH / GAME_HEIGHT;
            let w, h;
            if (windowRatio < gameRatio) { w = window.innerWidth; h = window.innerWidth / gameRatio; } 
            else { w = window.innerHeight * gameRatio; h = window.innerHeight; }
            container.style.width = w + 'px'; container.style.height = h + 'px';
            canvas.width = GAME_WIDTH; canvas.height = GAME_HEIGHT;
            canvas.style.width = '100%'; canvas.style.height = '100%';
        }
        window.addEventListener('resize', resize); resize();

        function getPos(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        const keys = { w: false, a: false, s: false, d: false };
        let joystick = { active: false, id: null, x: 0, y: 0, dx: 0, dy: 0, originX: 0, originY: 0 };
        
        window.addEventListener('keydown', e => { 
            let k = e.key.toLowerCase();
            if (keys.hasOwnProperty(k)) keys[k] = true; 
            if (e.key === ' ') {
                e.preventDefault();
                handleTreeClick(player.x, player.y + cameraY, true); 
            }
        });
        window.addEventListener('keyup', e => { if (keys.hasOwnProperty(e.key.toLowerCase())) keys[e.key.toLowerCase()] = false; });

        function handleTreeClick(cx, cy, isSpacebar = false) {
            let target = null;
            let minDist = 9999;
            trees.forEach(tree => {
                let clickDist = Math.hypot(cx - tree.x, cy - tree.y);
                let playerDist = Math.hypot(player.x - tree.x, player.y - tree.y - 80);
                
                if (playerDist < tree.trunkRadius + player.radius + 60) {
                    if (isSpacebar || clickDist < tree.radius + 50) {
                        if (playerDist < minDist) { minDist = playerDist; target = tree; }
                    }
                }
            });

            if (target) {
                if (player.targetTree === target) {
                    player.targetTree = null;
                } else {
                    if (!target.unlocked) {
                        if (money >= target.price) {
                            money -= target.price; updateMoney(); target.unlocked = true;
                            floatTexts.push({ x: target.x, y: target.y - 100, text: `잠금 해제!`, color: '#2ecc71', life: 60 });
                        } else {
                            floatTexts.push({ x: target.x, y: target.y - 100, text: `💰 ${target.price} 부족!`, color: 'red', life: 60 });
                        }
                    } else { player.targetTree = target; }
                }
            }
        }

        canvas.addEventListener('mousedown', e => {
            let pos = getPos(e.clientX, e.clientY);
            if (pos.x < GAME_WIDTH / 2 && pos.y > GAME_HEIGHT / 2) {
                joystick.active = true; joystick.originX = pos.x; joystick.originY = pos.y; joystick.x = pos.x; joystick.y = pos.y;
            } else { handleTreeClick(pos.x, pos.y + cameraY); }
        });
        canvas.addEventListener('mousemove', e => {
            if (joystick.active) {
                let pos = getPos(e.clientX, e.clientY);
                joystick.x = pos.x; joystick.y = pos.y; updateJoyMath();
            }
        });
        const resetJoyMouse = () => { joystick.active = false; joystick.dx = 0; joystick.dy = 0; joystick.id = null; };
        canvas.addEventListener('mouseup', resetJoyMouse); canvas.addEventListener('mouseleave', resetJoyMouse);

        canvas.addEventListener('touchstart', e => {
            if(e.target === canvas) e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) {
                let t = e.changedTouches[i]; let pos = getPos(t.clientX, t.clientY);
                if (pos.x < GAME_WIDTH / 2 && pos.y > GAME_HEIGHT / 2 && !joystick.active) {
                    joystick.active = true; joystick.id = t.identifier;
                    joystick.originX = pos.x; joystick.originY = pos.y; joystick.x = pos.x; joystick.y = pos.y;
                } else { handleTreeClick(pos.x, pos.y + cameraY); }
            }
        }, {passive: false});
        canvas.addEventListener('touchmove', e => {
            if(e.target === canvas) e.preventDefault();
            for(let i=0; i<e.changedTouches.length; i++) {
                let t = e.changedTouches[i]; let pos = getPos(t.clientX, t.clientY);
                if (joystick.active && joystick.id === t.identifier) { joystick.x = pos.x; joystick.y = pos.y; updateJoyMath(); }
            }
        }, {passive: false});
        canvas.addEventListener('touchend', e => {
            for(let i=0; i<e.changedTouches.length; i++) {
                let t = e.changedTouches[i];
                if (joystick.active && joystick.id === t.identifier) resetJoyMouse();
            }
        });

        function updateJoyMath() {
            let dx = joystick.x - joystick.originX, dy = joystick.y - joystick.originY;
            let dist = Math.hypot(dx, dy), maxR = 60;
            if (dist > maxR) { joystick.x = joystick.originX + (dx/dist)*maxR; joystick.y = joystick.originY + (dy/dist)*maxR; }
            joystick.dx = (joystick.x - joystick.originX) / maxR; joystick.dy = (joystick.y - joystick.originY) / maxR;
        }

        // --- 재편성된 과일 티어 및 아이템 리스트 ---
        const I_COM = ['사과', '오렌지', '바나나', '복숭아'];
        const I_RAR = ['키위', '블루베리', '배', '체리'];
        const I_SRA = ['멜론', '포도', '딸기'];
        const I_EPI = ['파인애플', '망고', '수박'];
        const I_LEG = ['레몬', '아보카도', '코코넛', '라임'];
        const I_MYT = ['용과', '블랙사파이어', '패션후르츠'];
        const I_ETE = ['골드키위', '플래티넘사과', '영겁의포도'];

        // 지역별 세부 드롭 테이블 구성
        const normalDropTables = [
            { chance: 0.50, name: '일반', price: 1500, xp: 2, color: '#ecf0f1', items: I_COM },
            { chance: 0.20, name: '희귀', price: 3000, xp: 8, color: '#3498db', items: I_RAR },
            { chance: 0.15, name: '초희귀', price: 5000, xp: 24, color: '#9b59b6', items: I_SRA },
            { chance: 0.10, name: '드문', price: 8000, xp: 60, color: '#f1c40f', items: I_EPI },
            { chance: 0.04, name: '전설', price: 10000, xp: 200, color: '#e67e22', items: I_LEG },
            { chance: 0.01, name: '신화적인', price: 15000, xp: 800, color: '#ff4757', items: I_MYT }
        ];

        const fireDropTables = [
            { chance: 0.45, name: '일반', price: 1500, xp: 2, color: '#ecf0f1', items: I_COM },
            { chance: 0.20, name: '희귀', price: 3000, xp: 8, color: '#3498db', items: I_RAR },
            { chance: 0.18, name: '드문', price: 8000, xp: 60, color: '#f1c40f', items: I_EPI },
            { chance: 0.12, name: '전설', price: 10000, xp: 200, color: '#e67e22', items: I_LEG },
            { chance: 0.05, name: '신화적인', price: 15000, xp: 800, color: '#ff4757', items: I_MYT }
        ];
        
        const twistedDropTables = [
            { chance: 0.40, name: '일반', price: 1500, xp: 2, color: '#ecf0f1', items: I_COM },
            { chance: 0.25, name: '희귀', price: 3000, xp: 8, color: '#3498db', items: I_RAR },
            { chance: 0.15, name: '초희귀', price: 5000, xp: 24, color: '#9b59b6', items: I_SRA },
            { chance: 0.10, name: '전설', price: 10000, xp: 200, color: '#e67e22', items: I_LEG },
            { chance: 0.08, name: '신화적인', price: 15000, xp: 800, color: '#ff4757', items: I_MYT },
            { chance: 0.02, name: '영원한', price: 20000, xp: 3000, color: '#ff9ff3', items: I_ETE }
        ];

        const electricDropTables = [
            { chance: 0.30, name: '일반', price: 1500, xp: 2, color: '#ecf0f1', items: I_COM },
            { chance: 0.20, name: '희귀', price: 3000, xp: 8, color: '#3498db', items: I_RAR },
            { chance: 0.15, name: '초희귀', price: 5000, xp: 24, color: '#9b59b6', items: I_SRA },
            { chance: 0.15, name: '드문', price: 8000, xp: 60, color: '#f1c40f', items: I_EPI },
            { chance: 0.10, name: '전설', price: 10000, xp: 200, color: '#e67e22', items: I_LEG },
            { chance: 0.07, name: '신화적인', price: 15000, xp: 800, color: '#ff4757', items: I_MYT },
            { chance: 0.03, name: '영원한', price: 20000, xp: 3000, color: '#ff9ff3', items: I_ETE }
        ];

        const iceDropTables = [
            { chance: 0.20, name: '일반', price: 1500, xp: 2, color: '#ecf0f1', items: I_COM },
            { chance: 0.20, name: '희귀', price: 3000, xp: 8, color: '#3498db', items: I_RAR },
            { chance: 0.20, name: '초희귀', price: 5000, xp: 24, color: '#9b59b6', items: I_SRA },
            { chance: 0.15, name: '드문', price: 8000, xp: 60, color: '#f1c40f', items: I_EPI },
            { chance: 0.12, name: '전설', price: 10000, xp: 200, color: '#e67e22', items: I_LEG },
            { chance: 0.08, name: '신화적인', price: 15000, xp: 800, color: '#ff4757', items: I_MYT },
            { chance: 0.05, name: '영원한', price: 20000, xp: 3000, color: '#ff9ff3', items: I_ETE }
        ];

        const radioactiveDropTables = [
            { chance: 0.10, name: '일반', price: 1500, xp: 2, color: '#ecf0f1', items: I_COM },
            { chance: 0.15, name: '희귀', price: 3000, xp: 8, color: '#3498db', items: I_RAR },
            { chance: 0.20, name: '초희귀', price: 5000, xp: 24, color: '#9b59b6', items: I_SRA },
            { chance: 0.20, name: '드문', price: 8000, xp: 60, color: '#f1c40f', items: I_EPI },
            { chance: 0.15, name: '전설', price: 10000, xp: 200, color: '#e67e22', items: I_LEG },
            { chance: 0.12, name: '신화적인', price: 15000, xp: 800, color: '#ff4757', items: I_MYT },
            { chance: 0.08, name: '영원한', price: 20000, xp: 3000, color: '#ff9ff3', items: I_ETE }
        ];

        let level = 1; let xp = 0; let maxXp = 20;
        let money = 0;
        let axeLevel = 0; // 0:기본, 1:나무도끼, 2:철(은)도끼, 3:금도끼
        let inventory = {};
        let ownedSkins = ['default'];
        let equippedSkin = 'default';

        function addXp(amount, x, y) {
            amount = amount * 10; // 유저 요청: 상시 경험치 10배 미친 버프! (사과 2xp -> 20xp)
            xp += amount;
            floatTexts.push({ x: x, y: y, text: `+${amount} XP`, color: '#3498db', life: 40 });
            let leveledUp = false;
            while (xp >= maxXp) {
                xp -= maxXp; level++; maxXp = Math.floor(maxXp * 1.5);
                leveledUp = true;
            }
            if (leveledUp) {
                document.getElementById('level-text').innerText = `LV. ${level}`;
                floatTexts.push({ x: player.x, y: player.y - 60, text: `LEVEL UP!`, color: '#f1c40f', life: 80, size: 24 });
            }
            document.getElementById('xp-bar-fill').style.width = `${(xp / maxXp) * 100}%`;
        }
        function updateMoney() { document.getElementById('money-display').innerText = `💰 ${money}`; }

        let fruitsOnGround = [];
        let floatTexts = [];

        function getItemColor(itemName) {
            let baseName = itemName.replace('불꽃 ', '').replace('뒤틀린 ', '').replace('전기 ', '').replace('얼음 ', '').replace('방사능 ', '');
            let tables = [...normalDropTables, ...twistedDropTables, ...electricDropTables, ...iceDropTables, ...radioactiveDropTables];
            for (let t of tables) {
                if (t.items.includes(baseName)) return t.color;
            }
            return '#fff';
        }

        // --- 상점 UI 및 도끼 로직 추가 ---
        document.getElementById('shop-btn').addEventListener('click', () => {
            document.getElementById('shop-modal').style.display = 'block';
            resetJoyMouse(); player.targetTree = null;
            updateAxeUI();
            updateShopSkinUI();
        });

        function switchShopTab(tab) {
            document.getElementById('shop-axe').style.display = tab === 'axe' ? 'block' : 'none';
            document.getElementById('shop-limited').style.display = tab === 'limited' ? 'block' : 'none';
            document.getElementById('shop-skin').style.display = tab === 'skin' ? 'block' : 'none';
            document.querySelectorAll('.shop-tab-btn').forEach((btn, idx) => {
                btn.className = (idx === 0 && tab === 'axe') || (idx === 1 && tab === 'limited') || (idx === 2 && tab === 'skin') ? 'shop-tab-btn active' : 'shop-tab-btn';
            });
        }

        function buyAxe(reqLevel, price) {
            if (axeLevel >= reqLevel) { alert('이미 더 좋거나 같은 등급의 도끼를 보유 중입니다!'); return; }

        function saveGame() {
            const data = {
                level: level, xp: xp, maxXp: maxXp, money: money, inventory: inventory,
                axeLevel: axeLevel,
                ownedSkins: ownedSkins, equippedSkin: equippedSkin,

        function loadGame() {
            const saved = localStorage.getItem('treeGameSave');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    level = data.level || 1;
                    xp = data.xp || 0;
                    maxXp = data.maxXp || 20;
                    money = data.money || 0;
                    axeLevel = data.axeLevel || 0;
                    if (data.ownedSkins) ownedSkins = data.ownedSkins;
                    if (data.equippedSkin) equippedSkin = data.equippedSkin;
                    if (data.inventory) inventory = { ...inventory, ...data.inventory };
                    if (data.treeUnlocked) {
                        trees.forEach((t, i) => {
                            if (data.treeUnlocked[i] !== undefined) t.unlocked = data.treeUnlocked[i];
                        });
                    }
                } catch(e) { console.error('Save file corrupted'); }
            }

            // 개발자 전용 치트: 로컬(파일 직접 실행 등)에서 테스트할 때만 레벨 10000 적용 (실제 Vercel 서버 유저는 레벨 1부터 정상 시작!)
            if (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
                if (level < 10000) {

                    maxXp = 999999999;

        function getTables(type) {
            if (type === 'radioactive') return radioactiveDropTables;
            if (type === 'ice') return iceDropTables;
            if (type === 'electric') return electricDropTables;
            if (type === 'twisted') return twistedDropTables;
            if (type === 'fire') return fireDropTables;
            return normalDropTables;
        }

        function generateCustomer(type) {
            let tables = getTables(type);
            let r = Math.random(), cum = 0, tier = tables[0];
            for (let t of tables) { cum += t.chance; if (r <= cum) { tier = t; break; } }
            
            let fruit = tier.items[Math.floor(Math.random() * tier.items.length)];
            let amount = Math.floor(Math.random() * 3) + 1;
            let reward = tier.price * amount; // 유저 요청 기준가 적용

            // 다중 구매(2~3개) 시 약 2000원(1500~2500) 할인 적용
            if (amount > 1) {
                let discount = Math.floor(Math.random() * 1000) + 1500; 
                reward = Math.max(reward - discount, tier.price); // 할인해도 최소 1개값은 보장
            }

            reward = Math.floor(reward); // 소수점 방지
            
            const skins = ['#ffeaa7', '#fab1a0', '#e1b12c', '#8c7ae6', '#c8d6e5'];
            const shirts = ['#3498db', '#e74c3c', '#9b59b6', '#2ecc71', '#f1c40f', '#34495e'];
            const hats = ['#2c3e50', '#8B4513', '#c0392b', '#16a085', '#d35400'];
            
            return {
                x: -50, walkTimer: 0, fruit: fruit, amount: amount, reward: reward,
                colors: { skin: skins[Math.floor(Math.random()*skins.length)], shirt: shirts[Math.floor(Math.random()*shirts.length)], hat: hats[Math.floor(Math.random()*hats.length)] }
            };
        }

        function spawnFruit(x, y, type) {
            let tables = getTables(type);
            let r = Math.random(), cum = 0, data = null;
            for (let t of tables) { cum += t.chance; if (r <= cum) { data = { fruit: t.items[Math.floor(Math.random() * t.items.length)], color: t.color, xp: t.xp, price: t.price }; break; } }
            
            if(data) {
                let trait = '';
                let traitType = null;
                // 일반지형 빼고 나무에서 떨어질 때 35% 확률로 특성 부여
                if (type !== 'normal' && Math.random() < 0.35) {
                    traitType = type;
                    if (type === 'fire') trait = '불꽃 ';
                    else if (type === 'twisted') trait = '뒤틀린 ';
                    else if (type === 'electric') trait = '전기 ';
                    else if (type === 'ice') trait = '얼음 ';
                    else if (type === 'radioactive') trait = '방사능 ';
                }

                fruitsOnGround.push({
                    x: x, y: y + 80, vx: (Math.random() - 0.5) * 10, vy: (Math.random() - 0.5) * 8 - 4,
                    fruit: trait + data.fruit, color: data.color, xp: data.xp, price: data.price, life: 600,
                    traitType: traitType
                });
            }
        }

        function update() {
            if (document.getElementById('inventory-modal').style.display === 'block') return;

            let moveX = 0, moveY = 0;
            if (keys.w) moveY -= 1; if (keys.s) moveY += 1;
            if (keys.a) moveX -= 1; if (keys.d) moveX += 1;
            
            if (moveX !== 0 || moveY !== 0) {
                let mag = Math.hypot(moveX, moveY);
                player.vx = (moveX / mag) * player.speed; player.vy = (moveY / mag) * player.speed;
            } else if (joystick.active) {
                player.vx = joystick.dx * player.speed; player.vy = joystick.dy * player.speed;
            } else { player.vx *= 0.8; player.vy *= 0.8; }

            let isMoving = Math.hypot(player.vx, player.vy) > 0.5;
            
            if (isMoving) {
                player.targetTree = null; player.walkTimer++;
                player.x += player.vx; player.y += player.vy;
                if (Math.abs(player.vx) > 0.1) player.facing = player.vx > 0 ? 1 : -1;
            } else { player.walkTimer = 0; }

            player.x = Math.max(player.radius, Math.min(GAME_WIDTH - player.radius, player.x));
            player.y = Math.max(-4950, Math.min(GAME_HEIGHT - player.radius, player.y));
            
            if (level < 3 && player.y < 30 && player.y > -500) {
                player.y = 30;
                if (Math.random() < 0.05) floatTexts.push({ x: player.x, y: player.y - 40, text: `레벨 3 달성 시 통과 가능!`, color: 'red', life: 40 });
            } else if (level < 10 && player.y < -970 && player.y > -1500) {
                player.y = -970;
                if (Math.random() < 0.05) floatTexts.push({ x: player.x, y: player.y - 40, text: `레벨 10 달성 시 통과 가능!`, color: '#9b59b6', life: 40 });
            } else if (level < 25 && player.y < -1970 && player.y > -2500) {
                player.y = -1970;
                if (Math.random() < 0.05) floatTexts.push({ x: player.x, y: player.y - 40, text: `레벨 25 달성 시 통과 가능!`, color: '#fbc531', life: 40 });
            } else if (level < 40 && player.y < -2970 && player.y > -3500) {
                player.y = -2970;
                if (Math.random() < 0.05) floatTexts.push({ x: player.x, y: player.y - 40, text: `레벨 40 달성 시 통과 가능!`, color: '#c7ecee', life: 40 });
            } else if (level < 60 && player.y < -3970 && player.y > -4500) {
                player.y = -3970;
                if (Math.random() < 0.05) floatTexts.push({ x: player.x, y: player.y - 40, text: `레벨 60 달성 시 통과 가능!`, color: '#2ecc71', life: 40 });
            }

            shops.forEach(shop => {
                let sx = shop.x - 20, sy = shop.y; 
                if (player.x > sx - player.radius && player.y > sy - player.radius && player.y < sy + 200 + player.radius) {
                    if (player.x - player.vx <= sx - player.radius) player.x = sx - player.radius;
                    else if (player.y - player.vy <= sy - player.radius) player.y = sy - player.radius;
                    else if (player.y - player.vy >= sy + 200 + player.radius) player.y = sy + 200 + player.radius;
                }
            });

            let targetCamY = player.y - GAME_HEIGHT / 2 + 100;
            targetCamY = Math.max(-5000, Math.min(0, targetCamY));
            cameraY += (targetCamY - cameraY) * 0.1;

            trees.forEach(tree => {
                let distToTree = Math.hypot(player.x - tree.x, player.y - tree.y - 80);
                if (player.targetTree === tree) {
                    if (distToTree > tree.trunkRadius + player.radius + 60) {
                        player.targetTree = null;
                    } else {
                        player.shakeTimer++;
                        tree.shakeAngle = Math.sin(player.shakeTimer * 0.8) * 0.05;
                        tree.progress += 1;
                        
                        let maxP = tree.maxProgress;
                        if (axeLevel === 1) maxP = Math.floor(tree.maxProgress * (4.0 / 5.0)); // 4초
                        else if (axeLevel === 2) maxP = Math.floor(tree.maxProgress * (3.5 / 5.0)); // 3.5초
                        else if (axeLevel === 3) maxP = Math.floor(tree.maxProgress * (3.2 / 5.0)); // 3.2초

                        if (tree.progress >= maxP) {
                            tree.progress = 0;
                            let dropCount = Math.floor(Math.random() * (tree.drops[1] - tree.drops[0] + 1)) + tree.drops[0];
                            for(let i=0; i<dropCount; i++) spawnFruit(tree.x, tree.y, tree.type);
                        }
                    }
                } else {
                    tree.shakeAngle = 0;
                }
            });

            for (let i = fruitsOnGround.length - 1; i >= 0; i--) {
                let f = fruitsOnGround[i];
                f.x += f.vx; f.y += f.vy; f.vx *= 0.9;
                if (f.vy < 5) f.vy += 0.4;
                if (f.vy > 0 && f.vy < 0.5) { f.vy = 0; f.vx = 0; }
                if (f.x < 10 || f.x > GAME_WIDTH - 10) f.vx *= -1;
                
                let distToP = Math.hypot(player.x - f.x, player.y - f.y);
                if (distToP < player.radius + 50) {
                    f.x += (player.x - f.x) * 0.15; f.y += (player.y - f.y) * 0.15;
                    if (distToP < player.radius + 10) {
                        // 특성이 붙은 과일도 동적으로 인벤토리에 추가
                        if (inventory[f.fruit] === undefined) inventory[f.fruit] = 0;
                        inventory[f.fruit]++;
                        floatTexts.push({ x: player.x, y: player.y - 40, text: `+${f.fruit}`, color: f.color, life: 40 });
                        addXp(f.xp, player.x + 20, player.y - 60);
                        fruitsOnGround.splice(i, 1); continue;
                    }
                }
                f.life--; if (f.life <= 0) fruitsOnGround.splice(i, 1);
            }

            shops.forEach(shop => {
                if (shop.queue.length < 5 && Math.random() < 0.01) {
                    let newCustomer = generateCustomer(shop.type);
                    newCustomer.y = shop.queueY;
                    shop.queue.push(newCustomer);
                }
                
                shop.queue.forEach((c, i) => {
                    let tx = shop.frontX - i * 60, dx = tx - c.x;
                    if (Math.abs(dx) > 2) { c.x += dx > 0 ? 2 : -2; c.walkTimer++; c.facing = dx > 0 ? 1 : -1; } 
                    else { c.x = tx; c.walkTimer = 0; c.facing = 1; }
                });

                if (shop.queue.length > 0) {
                    let firstC = shop.queue[0];
                    if (firstC.x === shop.frontX && Math.hypot(player.x - firstC.x, player.y - shop.queueY) < 70) {
                        
                        let baseName = firstC.fruit;
                        let totalAvailable = (inventory[baseName]||0) + (inventory['불꽃 '+baseName]||0) + (inventory['뒤틀린 '+baseName]||0) + (inventory['전기 '+baseName]||0) + (inventory['얼음 '+baseName]||0) + (inventory['방사능 '+baseName]||0);

                        if (totalAvailable >= firstC.amount) {
                            let needed = firstC.amount;
                            let baseRewardPerItem = firstC.reward / firstC.amount;
                            let totalEarned = 0;
                            
                            // 수익이 가장 높은 특성 과일 우선 소모 (가장 비싸게 팔아줌!)
                            const traits = [
                                { name: '방사능 ', mult: 3.0 },
                                { name: '얼음 ', mult: 2.5 },
                                { name: '전기 ', mult: 2 },
                                { name: '뒤틀린 ', mult: 2 },
                                { name: '불꽃 ', mult: 1.5 },
                                { name: '', mult: 1 } // 기본 과일
                            ];

                            for (let tr of traits) {
                                if (needed <= 0) break;
                                let itemName = tr.name + baseName;
                                let available = inventory[itemName] || 0;
                                let take = Math.min(available, needed);
                                if (take > 0) {
                                    inventory[itemName] -= take;
                                    needed -= take;
                                    totalEarned += take * baseRewardPerItem * tr.mult;
                                }
                            }
                            
                            totalEarned = Math.floor(totalEarned);
                            money += totalEarned; updateMoney();
                            
                            // 주울 때와 완전히 동일한 XP 지급!
                            let baseItemXp = 2; // 기본값
                            let tables = [...normalDropTables, ...twistedDropTables, ...electricDropTables, ...iceDropTables, ...radioactiveDropTables];
                            for (let t of tables) { if (t.items.includes(baseName)) { baseItemXp = t.xp; break; } }
                            let earnedXp = firstC.amount * baseItemXp;
                            
                            addXp(earnedXp, firstC.x, shop.queueY - 100);
                            
                            floatTexts.push({ x: firstC.x, y: shop.queueY - 80, text: `+💰${totalEarned}`, color: 'gold', life: 60 });
                            shop.queue.shift();
                        }
                    }
                }
            });

            for (let i = floatTexts.length - 1; i >= 0; i--) {
                floatTexts[i].y -= 1; floatTexts[i].life--;
                if (floatTexts[i].life <= 0) floatTexts.splice(i, 1);
            }
        }

        function drawCharacter(ctx, char, x, y, isShaking, walkTimer, forceSkin = null) {

                ctx.fillStyle = '#3e2723'; ctx.fillRect(-6, 10, 12, 6); ctx.restore();

                ctx.lineTo(20, 22); ctx.quadraticCurveTo(25, 5, 10, -10); ctx.fill();

                ctx.fillStyle = '#4b3832';
                ctx.beginPath(); ctx.roundRect(-12, -8, 24, 20, 4); ctx.fill();

                ctx.fillStyle = '#e67e22'; ctx.beginPath(); ctx.arc(0, 16, 4, 0, Math.PI*2); ctx.fill(); ctx.restore();

                ctx.fillStyle = '#e67e22'; ctx.beginPath(); ctx.arc(0, 16, 4, 0, Math.PI*2); ctx.fill(); ctx.restore();

                    ctx.save(); ctx.translate(15, 0); ctx.rotate(Math.PI/4); ctx.fillRect(-4, -20 - sE, 8, 20); ctx.beginPath(); ctx.arc(0, -22 - sE, 6, 0, Math.PI*2); ctx.fill(); ctx.restore();

                    ctx.save(); ctx.translate(18, 0); ctx.rotate((walkAngle * Math.PI)/180); ctx.fillRect(-4, 0, 8, 15); ctx.restore();

                ctx.fillStyle = headGrad; ctx.beginPath(); ctx.arc(0, -20, 15, 0, Math.PI*2); ctx.fill();

        function drawShop(ctx, shop) {

            let wallGrad = ctx.createLinearGradient(x, y, x, y + 210);

            ctx.fillStyle = '#111'; ctx.fillRect(x, y + 100, 40, 40);
            
            ctx.fillStyle = shop.roofColor;
            ctx.beginPath(); ctx.moveTo(x - 20, y + 80); ctx.lineTo(x + 90, y); ctx.lineTo(x + 200, y + 80); ctx.fill();

            ctx.fillStyle = '#d35400'; ctx.fillRect(x + 40, y + 40, 110, 35); ctx.strokeStyle = '#2c3e50'; ctx.lineWidth = 3; ctx.strokeRect(x + 40, y + 40, 110, 35);

        function draw() {

            ctx.translate(0, -cameraY);

            ctx.fillStyle = '#48dbfb'; ctx.fillRect(0, -4000, GAME_WIDTH, 1000); 
            ctx.fillStyle = '#273c75'; ctx.fillRect(0, -3000, GAME_WIDTH, 1000); 
            ctx.fillStyle = '#2c3e50'; ctx.fillRect(0, -2000, GAME_WIDTH, 1000);  
            ctx.fillStyle = '#cf3a24'; ctx.fillRect(0, -1000, GAME_WIDTH, 1000); 
            ctx.fillStyle = '#55a630'; ctx.fillRect(0, 0, GAME_WIDTH, 1000);

            ctx.fillStyle = '#d35400'; ctx.font = 'bold 20px Arial'; ctx.textAlign = 'center'; ctx.fillText("🔥 위험: 불꽃 지역 (레벨 3 진입 가능)", GAME_WIDTH / 2, -20);

            ctx.strokeStyle = '#fbc531'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(0, -2000); ctx.lineTo(GAME_WIDTH, -2000); ctx.stroke();
            ctx.fillStyle = '#fbc531'; ctx.fillText("⚡ 격동: 전기 지역 (레벨 25 진입 가능)", GAME_WIDTH / 2, -2020);

            ctx.strokeStyle = '#c7ecee'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(0, -3000); ctx.lineTo(GAME_WIDTH, -3000); ctx.stroke();
            ctx.fillStyle = '#c7ecee'; ctx.fillText("❄️ 혹한: 얼음 지역 (레벨 40 진입 가능)", GAME_WIDTH / 2, -3020);

            ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(0, -4000); ctx.lineTo(GAME_WIDTH, -4000); ctx.stroke();
            ctx.fillStyle = '#2ecc71'; ctx.fillText("☣️ 치명적 위험: 방사능 지역 (레벨 60 진입 가능)", GAME_WIDTH / 2, -4020);

            });
            
            trees.forEach(t => renderList.push({ type: 'tree', obj: t, y: t.y }));
            renderList.sort((a, b) => a.y - b.y);

            renderList.forEach(item => {
                if (item.type === 'fruit') {

                    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(f.x, f.y + 10, 8, 3, 0, 0, Math.PI*2); ctx.fill();
                    if (f.life < 100 && Math.floor(f.life / 10) % 2 === 0) return;

                    // 과일 특성(Trait) 시각적 효과 표시!

                    } else if (f.traitType === 'ice') {

                        ctx.beginPath(); ctx.moveTo(f.x - 4, f.y - 12); ctx.lineTo(f.x + 4, f.y - 12); ctx.lineTo(f.x, f.y - 6); ctx.fill();
                    } else if (f.traitType === 'radioactive') {

                        ctx.fillStyle = 'black';

                    ctx.strokeStyle = strokeColor; ctx.lineWidth = 3;

                        else if (axeLevel === 3) maxP = Math.floor(t.maxProgress * (3.2 / 5.0));
                        ctx.fillStyle = '#3498db'; ctx.fillRect(-38, -143, 76 * (t.progress / maxP), 8);
                        ctx.fillStyle = 'white'; ctx.font = '10px Arial'; ctx.textAlign = 'center'; ctx.fillText("흔드는 중...", 0, -150);
                    }

                    if (t.type === 'ice') {
                        let leafGrad = ctx.createLinearGradient(0, -180, 0, 0);
                        leafGrad.addColorStop(0, '#c7ecee'); leafGrad.addColorStop(1, '#81ecec');
                        ctx.fillStyle = leafGrad;
                        ctx.beginPath(); ctx.moveTo(0, -t.radius*1.3); ctx.lineTo(-t.radius, 20); ctx.lineTo(t.radius, 20); ctx.fill();
                        ctx.beginPath(); ctx.moveTo(0, -t.radius*1.6); ctx.lineTo(-t.radius*0.8, -30); ctx.lineTo(t.radius*0.8, -30); ctx.fill();
                        ctx.beginPath(); ctx.moveTo(0, -t.radius*1.9); ctx.lineTo(-t.radius*0.6, -80); ctx.lineTo(t.radius*0.6, -80); ctx.fill();

                        ctx.fillStyle = 'rgba(255,255,255,0.8)';
                        [[-80, 20, 30], [-40, 20, 50], [0, 20, 70], [40, 20, 50], [80, 20, 30]].forEach(p => {
                            ctx.beginPath(); ctx.moveTo(p[0]-10, p[1]); ctx.lineTo(p[0]+10, p[1]); ctx.lineTo(p[0], p[1]+p[2]); ctx.fill();
                        });
                    } else if (t.type === 'radioactive') {
                        // 고급스러운 에메랄드 금장 방사능 나무
                        let leafGrad = ctx.createRadialGradient(0, -60, 20, 0, -50, t.radius);
                        leafGrad.addColorStop(0, '#2ecc71'); leafGrad.addColorStop(1, '#16a085'); // 에메랄드
                        
                        ctx.shadowColor = '#27ae60'; ctx.shadowBlur = 15;
                        ctx.fillStyle = leafGrad;
                        ctx.beginPath(); ctx.arc(-60, -30, t.radius*0.8, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(60, -30, t.radius*0.8, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(0, -100, t.radius, 0, Math.PI*2); ctx.fill();
                        
                        // 금장 포인트 및 방사능 마크 형태 장식
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = '#f1c40f'; // 금장
                        ctx.beginPath(); ctx.arc(0, -60, 15, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = 'black';
                        ctx.beginPath(); ctx.arc(0, -60, 5, 0, Math.PI*2); ctx.fill();
                        // 잎사귀 장식
                        ctx.fillStyle = 'rgba(241, 196, 15, 0.7)';
                        ctx.beginPath(); ctx.arc(-50, -110, 8, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(50, -110, 8, 0, Math.PI*2); ctx.fill();
                    } else if (t.type === 'electric') {
                        let time = Date.now() / 150;
                        let s1 = 1 + Math.sin(time)*0.06;
                        let s2 = 1 + Math.cos(time)*0.06;
                        let leafGrad = ctx.createRadialGradient(0, -60, 20, 0, -50, t.radius+40);
                        leafGrad.addColorStop(0, t.color1); leafGrad.addColorStop(1, t.color2);
                        ctx.fillStyle = leafGrad;
                        ctx.beginPath(); ctx.arc(-60, -30, t.radius*0.8*s1, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(60, -30, t.radius*0.8*s2, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(0, -90, t.radius*1.1*s1, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(0, -40, t.radius*1.2*s2, 0, Math.PI*2); ctx.fill();

                        ctx.strokeStyle = '#f5f6fa'; ctx.lineWidth = 4;
                        if (Math.random() > 0.4) {
                            ctx.beginPath(); 
                            ctx.moveTo(0, -100); ctx.lineTo(-30 + Math.random()*60, -60); 
                            ctx.lineTo(-20 + Math.random()*40, -30); ctx.lineTo(-40 + Math.random()*80, 10); ctx.stroke();
                        }
                    } else {
                        let leafGrad = ctx.createRadialGradient(0, -60, 20, 0, -50, t.radius+40);
                        leafGrad.addColorStop(0, t.color1); leafGrad.addColorStop(1, t.color2);
                        ctx.fillStyle = leafGrad;
                        ctx.beginPath(); ctx.arc(-60, -30, t.radius*0.8, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(60, -30, t.radius*0.8, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(0, -90, t.radius*1.1, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(0, -40, t.radius*1.2, 0, Math.PI*2); ctx.fill();
                        
                        if (t.type === 'twisted') {
                            ctx.fillStyle = 'rgba(0,0,0,0.3)';
                            ctx.beginPath(); ctx.arc(-20, -100, 15, 0, Math.PI*2); ctx.fill();
                            ctx.beginPath(); ctx.arc(40, -50, 20, 0, Math.PI*2); ctx.fill();
                            ctx.beginPath(); ctx.arc(-50, -20, 12, 0, Math.PI*2); ctx.fill();
                        }
                    }

                    if (!t.unlocked) {
                        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.arc(0, -50, 40, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = 'white'; ctx.font = 'bold 24px Arial'; ctx.textAlign = 'center'; ctx.fillText("🔒", 0, -55);
                        ctx.font = 'bold 16px Arial'; ctx.fillStyle = 'gold'; ctx.fillText(`${t.price} 💰`, 0, -35);
                    }
                    ctx.restore();

                    if (Math.hypot(player.x - t.x, player.y - t.y - 80) < t.trunkRadius + player.radius + 60 && player.targetTree !== t) {
                        ctx.fillStyle = 'white'; ctx.beginPath(); ctx.roundRect(t.x - 50, t.y - t.radius - 80, 100, 30, 5); ctx.fill();
                        ctx.fillStyle = 'black'; ctx.font = 'bold 12px Arial'; ctx.textAlign = 'center';
                        ctx.fillText(t.unlocked ? "👆 클릭!" : "👆 잠금 해제", t.x, t.y - t.radius - 60);
                    }
                }
            });

            shops.forEach(shop => drawShop(ctx, shop));

            floatTexts.forEach(t => {
                ctx.fillStyle = t.color; ctx.globalAlpha = t.life / 40;
                let size = t.size || 18; ctx.font = `bold ${size}px Arial`; ctx.textAlign = 'center';
                ctx.shadowColor = 'black'; ctx.shadowBlur = 4;
                ctx.fillText(t.text, t.x, t.y); ctx.shadowBlur = 0;
            });
            ctx.globalAlpha = 1.0;

            ctx.restore(); 

            if (joystick.active) {
                ctx.beginPath(); ctx.arc(joystick.originX, joystick.originY, 60, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255, 255, 255, 0.2)'; ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)'; ctx.lineWidth = 2; ctx.stroke();
                ctx.beginPath(); ctx.arc(joystick.x, joystick.y, 25, 0, Math.PI * 2); ctx.fillStyle = 'rgba(255, 255, 255, 0.8)'; ctx.fill();
            }
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        gameLoop();
    </script>
</body>
</html>
